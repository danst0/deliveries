[package]
name = "deliveries_tracker"
version = "0.2.5"
edition = "2024"
default-run = "deliveries_tracker"

[dependencies]
gtk4 = { version = "0.7", package = "gtk4" }
reqwest = { version = "0.11", features = ["blocking", "gzip", "json"] }
anyhow = "1"
async-channel = "1.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
headless_chrome = "0.9"
