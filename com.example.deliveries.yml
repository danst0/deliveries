app-id: com.example.deliveries
runtime: org.gnome.Platform
runtime-version: '49'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: deliveries_tracker
finish-args:
  - --share=network
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --filesystem=xdg-data/deliveries-tracker:create
modules:
  - name: deliveries
    buildsystem: simple
    build-commands:
      - . /usr/lib/sdk/rust-stable/enable && cargo build --release
      - install -Dm755 target/release/deliveries_tracker /app/bin/deliveries_tracker
      - install -Dm644 data/com.example.deliveries.desktop /app/share/applications/com.example.deliveries.desktop
      - install -Dm644 data/com.example.deliveries.metainfo.xml /app/share/metainfo/com.example.deliveries.metainfo.xml
      - install -Dm644 icons/icon.png /app/share/icons/hicolor/128x128/apps/com.example.deliveries.png
    sources:
      - type: dir
        path: .
